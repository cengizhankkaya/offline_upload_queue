name: offline_upload_queue
description: "Offline-first image upload queue for Flutter — persistent, retry-capable, background-aware."
version: 0.6.0
homepage: https://github.com/cengizhankkaya/offline_upload_queue
repository: https://github.com/cengizhankkaya/offline_upload_queue
issue_tracker: https://github.com/cengizhankkaya/offline_upload_queue/issues
topics:
  - flutter
  - upload
  - offline-first
  - queue
  - sembast

platforms:
  android:
  ios:

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  sembast: ^3.8.1            # pure-Dart document store (sembast_io dahil, native binary yok)
  dio: ^5.8.0+1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.6
  uuid: ^4.5.1
  path_provider: ^2.1.5
  path: ^1.9.1
  workmanager: ^0.9.0+3     # Android arka plan tetikleme (OneOffWorkRequest zinciri — bkz. §13)
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.0
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  fake_async: ^1.3.1

